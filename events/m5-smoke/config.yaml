    start:
    - 10
    - 20
    level_every_hands: 25
    schedule: doubling
  points: standard
variant: nlhe
variant_pool:
- nlhe
- shortdeck
- plo
- crazy_pineapple
- royal
- twist
tournament:
  iterations: 400
  decision_limit_ms: 1.0
  timing: thread_cpu
  hang_watchdog_ms: 50
  init_limit_s: 2
  import_limit_s: 30
  workers: auto
  bot_size_limit_mb: 100
  allowed_packages:
  - numpy
kit:
  localsim_max_tables: 200
  localsim_max_seconds: 60
paths:
  workspaces_root: ~/nolimit-workspaces
  builder_venv: ~/nolimit-workspaces/.venv
  events_root: events
