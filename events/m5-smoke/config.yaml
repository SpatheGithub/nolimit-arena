  models:
    sonnet: 2
  archetypes: none
  launch_stagger_seconds: 2
  max_budget_usd_per_builder: 5
auth:
  mode: subscription
schedule:
  build_minutes: 4
  submit_cooldown_seconds: 120
  tournaments: 1
  patch_minutes: 0
  feedback: own_stats_and_sample_hands
table:
  seats: 8
  starting_stack: 2000
  hand_cap: 200
