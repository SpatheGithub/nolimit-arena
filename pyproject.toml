[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nolimit-arena"
version = "0.1.0"
description = "Local practice arena for the No Limit pokerbot tournament"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "pokerkit>=0.7"]

[tool.setuptools.packages.find]
include = ["arena*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: long-running cross-validation; deselect with -m 'not slow'"]
